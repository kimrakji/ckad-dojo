apiVersion: v1
kind: Pod
metadata:
  name: service-web
  labels:
    app: service-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.30.5-alpine
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        tcpSocket:
          port: http
        initialDelaySeconds: 2
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: service-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
