apiVersion: v1
kind: Pod
metadata:
  name: config-reader
spec:
  containers:
    - name: reader
      image: busybox:1.37.0
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      env:
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: message
      volumeMounts:
        - name: settings
          mountPath: /etc/config
          readOnly: true
        - name: settings
          mountPath: /etc/single/message.txt
          subPath: message
          readOnly: true
  volumes:
    - name: settings
      configMap:
        name: demo-config
