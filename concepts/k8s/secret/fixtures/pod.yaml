apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  containers:
    - name: reader
      image: busybox:1.37.0
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      env:
        - name: DEMO_USER
          valueFrom:
            secretKeyRef:
              name: demo-credentials
              key: username
      volumeMounts:
        - name: credentials
          mountPath: /etc/credentials
          readOnly: true
  volumes:
    - name: credentials
      secret:
        secretName: demo-credentials
